name: Test read-only integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit and security regression tests
        run: python3 -m unittest discover -v
      - name: Offline report smoke test
        run: python3 -m rf5_github_audit --demo --output reports/demo
