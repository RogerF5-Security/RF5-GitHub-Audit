name: Test read-only integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Unit and security regression tests
        run: python3 -m unittest discover -v
      - name: Offline report smoke test
        run: python3 -m rf5_github_audit --demo --output reports/demo
