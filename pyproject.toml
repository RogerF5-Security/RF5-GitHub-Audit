[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rf5-github-audit"
version = "0.1.0"
description = "Read-only GitHub security posture inventory and offline HTML/JSON reporting"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Roger Arana / Roger F5"}]
dependencies = []

[project.scripts]
rf5-github-audit = "rf5_github_audit.cli:main"

[tool.setuptools]
packages = ["rf5_github_audit"]
